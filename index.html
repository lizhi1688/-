*{
    box-sizing:border-box;
}


body{

    margin:0;

    background:#050914;

    "Microsoft JhengHei",
    Arial,
    sans-serif;

    color:white;

/* 手機容器 */

.mobile{

    width:100%;

    max-width:430px;

    min-height:100vh;

    margin:auto;

    background:#101827;

    overflow:hidden;

}



/* 頂部 */

    text-align:center;

    padding:20px 15px;

.header h2{

    margin:0;

    font-size:22px;

}


.timer{

    margin-top:8px;

    font-size:24px;

    color:#4da3ff;

    font-weight:bold;

}





/* 卡片區 */


.container{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    padding:12px;

}




.card{

    background:#1b263b;

    border-radius:15px;

    overflow:hidden;

}




.card img{

    width:100%;

    height:210px;

    object-fit:cover;

}




.info{

    padding:10px;

}



.name{

    font-size:17px;

    font-weight:bold;

}



.location{

    margin-top:5px;

    font-size:12px;

    color:#fda4af;

}



.views{

    margin-top:4px;

    color:#94a3b8;

    font-size:12px;

}




.btn{

    width:90%;

    margin:10px 5%;

    padding:12px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(
    90deg,
    #3b82f6,
    #a855f7
    );


    color:white;

    font-size:14px;

}





/* 聊天頁 */

.chat-page{

    display:none;

    min-height:100vh;

    background:#101827;

}



.chat-header{

    padding:15px;

    border-bottom:1px solid #263246;

    display:flex;

    align-items:center;

    gap:12px;

}


.avatar{

    width:45px;

    height:45px;

    border-radius:50%;

    object-fit:cover;

}



.chat-name{

    font-size:18px;

    font-weight:bold;

}





.messages{

    padding:20px;

    min-height:70vh;

}



.msg{

    background:#273449;

    padding:14px;

    border-radius:18px;

    margin-bottom:15px;

    color:#e5e7eb;

    font-size:14px;

}





.chat-bottom{

    position:fixed;

    bottom:20px;

    width:100%;

    max-width:430px;

    padding:0 20px;

}



.chat-bottom button{


    width:100%;

    padding:16px;

    border:none;

    border-radius:30px;

    background:#00c853;

    color:white;

    font-size:18px;

    font-weight:bold;

}





/* 底部聲明 */


.footer{

    background:#101827;

    padding:30px 20px 40px;

    color:#718096;

    font-size:12px;

    line-height:1.8;

}



.footer-title{

    text-align:center;

    font-size:14px;

    color:#94a3b8;

    margin-bottom:15px;

}



.footer-line{

    height:1px;

    background:#263246;

    margin-bottom:18px;

}



.footer p{

    margin:12px 0;

}



.footer-links{

    text-align:center;

    margin-top:20px;

}


.footer-links a{

    color:#94a3b8;

    text-decoration:none;

    margin:0 8px;

}



.footer-links span{

    color:#475569;

}




</style>

//生成首页卡片


const list=document.getElementById("userList");



users.forEach((user,index)=>{


let card=document.createElement("div");


card.className="card";



card.innerHTML=`

<img src="${user.img}">


<div class="info">

<div class="name">

${user.name}

</div>


<div class="location">

📍${user.distance}

</div>


<div class="views">

${user.views}

</div>


</div>


<button class="btn">

查看资料

</button>

`;



card.onclick=()=>{

openChat(index);

};


list.appendChild(card);



});







//打开聊天页面


function openChat(index){


let user=users[index];


document.getElementById("home").style.display="none";


let chat=document.getElementById("chat");


chat.style.display="block";



document.getElementById("chatAvatar").src=user.img;


document.getElementById("chatName").innerHTML=user.name;



let box=document.getElementById("messages");


box.innerHTML="";



user.messages.forEach(text=>{


let div=document.createElement("div");


div.className="msg";


div.innerHTML=text;


box.appendChild(div);



});



}






//返回首页


function backHome(){


document.getElementById("chat").style.display="none";


document.getElementById("home").style.display="block";


}

setInterval(()=>{


seconds--;

let s=seconds%60;

s="0"+s;

}



document.querySelector(".timer").innerHTML=

m+":"+s;



},1000);
