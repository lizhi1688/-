<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>官方服務資訊</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#050914;
font-family:
"Microsoft JhengHei",
"Noto Sans TC",
sans-serif;
color:#fff;
}


.mobile{

max-width:430px;
min-height:100vh;
margin:auto;
background:#101827;

}


/* 頂部 */

.header{

text-align:center;
padding:25px 10px;

}


.header h1{

font-size:22px;
margin:0;

}


.sub{

margin-top:10px;
color:#60a5fa;
}



/* 卡片 */

.list{

display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:12px;

}


.card{

background:#1e293b;
border-radius:15px;
overflow:hidden;

}


.card img{

width:100%;
height:210px;
object-fit:cover;

}


.info{

padding:12px;

}


.name{

font-size:17px;
font-weight:bold;

}


.desc{

font-size:13px;
color:#cbd5e1;
margin-top:6px;

}


.btn{

width:90%;
margin:10px 5%;

padding:12px;

border:0;
border-radius:20px;

background:#00c853;

color:white;

font-size:15px;

}


/* 固定按鈕 */

.contact{

position:fixed;

bottom:20px;
left:50%;

transform:translateX(-50%);

width:90%;
max-width:390px;

padding:16px;

background:#2563eb;

border-radius:30px;

text-align:center;

font-size:18px;

font-weight:bold;

}



/* 聲明 */


.footer{

padding:30px 20px 100px;

font-size:12px;

line-height:1.8;

color:#94a3b8;

}


.footer h3{

text-align:center;

font-size:14px;

color:#cbd5e1;

}


</style>

</head>


<body>


<div class="mobile">


<div class="header">

<h1>
官方服務資訊
</h1>

<div class="sub">
歡迎查看服務內容與客服資訊
</div>

</div>



<div class="list" id="list"></div>



<div class="contact" onclick="contactLine()">

立即聯絡客服

</div>



<div class="footer">


<h3>
服務聲明
</h3>


<p>

【合規聲明】本平台僅提供資訊服務與客服聯絡入口，
所有內容均依相關規範管理。

</p>


<p>

為保障使用者權益，
請勿提供個人敏感資訊給非官方渠道。
如有問題請透過官方客服聯繫。

</p>


<p style="text-align:center">

隱私權政策　|　服務條款　|　聯絡我們

</p>


</div>



</div>




<script>


// =====================
// LINE客服輪轉
// 替換成你的官方客服LINE
// =====================


const lineList=[

"https://line.me/ti/p/~your_line_1",

"https://line.me/ti/p/~your_line_2",

"https://line.me/ti/p/~your_line_3",

"https://line.me/ti/p/~your_line_4"

];



function contactLine(){


let random=

Math.floor(Math.random()*lineList.length);


window.location.href=lineList[random];


}





// =====================
// 展示資料
// =====================


const data=[


["圖片1.jpg","服務專員A"],
["圖片2.jpg","服務專員B"],
["圖片3.jpg","服務專員C"],
["圖片4.jpg","服務專員D"],
["圖片5.jpg","服務專員E"],
["圖片6.jpg","服務專員F"],
["圖片7.jpg","服務專員G"],
["圖片8.jpg","服務專員H"],
["圖片9.jpg","服務專員I"],
["圖片10.jpg","服務專員J"]

];



const list=document.getElementById("list");



data.forEach(item=>{


let div=document.createElement("div");


div.className="card";


div.innerHTML=`

<img src="${item[0]}">


<div class="info">

<div class="name">

${item[1]}

</div>


<div class="desc">

點擊查看服務資訊

</div>


<button class="btn" onclick="contactLine()">

聯絡客服

</button>


</div>

`;



list.appendChild(div);



});



</script>



</body>

</html>
