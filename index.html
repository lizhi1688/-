<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>匹配成功</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#101827;

font-family:"Microsoft YaHei",Arial;

color:white;

}


/*顶部*/

.header{

text-align:center;

padding:20px;

}


.header h2{

font-size:22px;

margin:0;

}


.timer{

margin-top:8px;

color:#60a5fa;

font-size:22px;

font-weight:bold;

}



/*卡片*/

.container{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

padding:12px;

}



.card{

background:#1b263b;

border-radius:15px;

overflow:hidden;

}



.card img{

width:100%;

height:230px;

object-fit:cover;

}



.info{

padding:10px;

}



.name{

font-size:18px;

font-weight:bold;

}



.location{

font-size:13px;

color:#ccc;

margin-top:5px;

}



.views{

font-size:12px;

color:#aaa;

}



.btn{

width:90%;

margin:10px;

padding:12px;

border:0;

border-radius:12px;

background:linear-gradient(90deg,#3b82f6,#a855f7);

color:white;

font-size:15px;

}



/*消息*/

.message{

position:fixed;

right:15px;

bottom:120px;

background:white;

color:#333;

padding:12px;

border-radius:15px;

width:220px;

font-size:13px;

}



/*底部*/

.bottom{

position:fixed;

bottom:20px;

left:10px;

right:10px;

}



.bottom button{

width:100%;

padding:16px;

border:0;

border-radius:30px;

background:#00c853;

color:white;

font-size:18px;

font-weight:bold;

}


</style>


</head>



<body>


<div class="header">

<h2>
匹配成功（已认证）
</h2>


<div class="timer" id="time">
04:44
</div>


</div>





<div class="container">


<div class="card">

<img src="000.jpg">

<div class="info">

<div class="name">
直君
</div>

<div class="location">
📍附近0.5km
</div>

<div class="views">
1037 人看过
</div>

</div>

<button class="btn">
查看资料
</button>

</div>





<div class="card">

<img src="002.jpg">


<div class="info">

<div class="name">
雅琪
</div>


<div class="location">
📍附近1.2km
</div>


<div class="views">
856 人看过
</div>


</div>


<button class="btn">
查看资料
</button>


</div>





<div class="card">

<img src="003.jpg">


<div class="info">

<div class="name">
晓婷
</div>


<div class="location">
📍附近2km
</div>


</div>


<button class="btn">
查看资料
</button>


</div>






<div class="card">

<img src="004.jpg">


<div class="info">

<div class="name">
子晴
</div>


<div class="location">
📍附近3km
</div>


</div>


<button class="btn">
查看资料
</button>


</div>


</div>





<div class="message">

💬 新消息<br><br>

有人查看了你的资料


</div>





<div class="bottom">

<button>

立即查看信息

</button>


</div>





<script>


let seconds=284;


setInterval(()=>{


seconds--;


let m=Math.floor(seconds/60);

let s=seconds%60;


if(s<10){

s="0"+s;

}


document.getElementById("time").innerHTML=

m+":"+s;


},1000);



</script>



</body>

</html>
